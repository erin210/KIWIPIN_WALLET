    <script>
        // $(function () {
        //     $('base').attr('href', apiUrl);
        // });

        //從result回來，對照參數
        var params = new URLSearchParams(window.location.search);
        var activeTab = params.get('activeTab');


        if (!activeTab == null) {
            switchTab(activeTab);
        }

        function renderInfo(json) {
            

            var amountNUM = Number(json.U_KIWI_POINT);
            $('#f_data').val(json.data);
            $('#b_data').val(json.data);
            $('.point_amount span').html(formatCurrency(amountNUM));
            $('#buy_pin_amount').text(json.AMOUNT);



            Object.keys(json).forEach(function (k) {
                var eleName = '#' + k;
                // console.log(eleName + ' - ' + json[k]);
                if ($(eleName).length <= 0) {
                    appendElement_Input('#form', k, json[k]);
                } else {
                    $(eleName).val(json[k]);
                }
            });
            //千元標註
            function formatCurrency(number) {
                // 確保 number 是一個整數
                if (!Number.isInteger(number)) return null;

                // 將整數轉成字串，並利用正規表達式添加逗號
                return number.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            }
            $('#userID').text(json.U_EMAIL);
            
            initTranslation(json)//翻譯

        }


        //手機點擊語言
        // $('#langSelect').on('click',function(){
        //     console.log("open");
        //     $('#langListItem').hide().slideToggle(200);
        // });
        //密碼眼睛
        let pageBaseUrl = '';
        $('#togglePassword').on('click', function () {
            const passwordField = $('#U_PINCODE');
            const isPasswordVisible = passwordField.attr('type') === 'text';
            passwordField.attr('type', isPasswordVisible ? 'password' : 'text');

            const newIconSrc = isPasswordVisible ? pageBaseUrl + 'https://https://stage-page.kiwipin.com/wallet/assets/img/icon_eye_close.svg' : pageBaseUrl + 'https://https://stage-page.kiwipin.com/wallet/assets/img/icon_eye_open.svg';
            $(this).attr('src', newIconSrc);
        });

        function switchTab(tab) {
            $(".tab_content").hide();
            $("#" + tab).fadeIn();
            $("div.tabs div").removeClass("active");
            $("." + tab).addClass("active");
        }


        function appendElement_Input(ele, name, value) {
            var textHtml = '<input type="hidden" name="' + name + '"';
            textHtml += ' value="' + value + '"';
            textHtml += '/>';
            $(ele).append(textHtml);
        }

        $(document).ready(function() {
            // 取得上一次關閉彈窗的時間戳記 (Timestamp)
            var lastCloseTime = localStorage.getItem('kiwipin_popup_close_time');
            var currentTime = new Date().getTime(); // 取得目前時間戳記
            
            // 定義 6 小時的毫秒數 (6小時 * 60分鐘 * 60秒 * 1000毫秒)
            var sixHoursInMs = 6 * 60 * 60 * 1000; 

            $('.confirm').on('click',function(){
                    localStorage.setItem('kiwipin_popup_close_time',currentTime);
                })

            if (lastCloseTime) {
                // 如果有紀錄，計算過了多久
                var timePassed = currentTime - parseInt(lastCloseTime, 10);
                
                if (timePassed < sixHoursInMs) {
                    // 如果還沒超過 6 小時，強制隱藏彈窗
                    $('#popup').hide();
                } else {
                    // 如果已經超過 6 小時，清除舊紀錄，讓彈窗正常顯示
                    localStorage.removeItem('kiwipin_popup_close_time');
                    $('#popup').show();
                }
            } else {
                // 如果完全沒有紀錄（第一次進網頁），正常顯示彈窗
                $('#popup').show();
            }
        });

        // 當使用者點擊「我知道了」時觸發的函式
        function closePopupAndStartTimer() {
            // 關閉彈窗
            $('#popup').hide();
            
            // 紀錄當前的時間戳記到 localStorage
            var now = new Date().getTime();
            localStorage.setItem('kiwipin_popup_close_time', now);
        }

    </script>
